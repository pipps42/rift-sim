services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: riftbound-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: riftbound
      POSTGRES_PASSWORD: password
      POSTGRES_DB: riftbound_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U riftbound']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (optional, for production caching)
  redis:
    image: redis:7-alpine
    container_name: riftbound-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
